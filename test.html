<script type="module">

import * as THREE from 'three';
import { OrbitControls } from 'https://unpkg.com/three@0.141.0/examples/jsm/controls/OrbitControls.js';

window.addEventListener(`DOMContentLoaded`, () => {        
const scene = new THREE.Scene()

const camera = new THREE.PerspectiveCamera(
  100,
  window.innerWidth / window.innerHeight,0.1,10000
);
camera.position.set(0,0,0);
camera.rotation.set(0,0,0);
const renderer = new THREE.WebGLRenderer({
  canvas: document.getElementById('mc'),
  antialias:true
}
)
renderer.setSize(window.innerWidth, window.innerHeight)

const pointLight = new THREE.PointLight(0xffffff);
pointLight.position.set(5, 5, 5);

const ambientLight = new THREE.AmbientLight(0xffffff);
scene.add(pointLight, ambientLight);

function addStar() {
  const geometry = new THREE.SphereGeometry(Math.random()*0.1.toPrecision(2), 10, 10);
  const material = new THREE.MeshStandardMaterial({ color: Math.random() * 0xffffff });
  const star = new THREE.Mesh(geometry, material);

  const [x, y, z] = Array(3)
    .fill()
    .map(() => THREE.MathUtils.randFloatSpread(50));

  star.position.set(x, y, z);
  scene.add(star);
}

Array(500).fill().forEach(addStar);


const img_plane = new Image();

img_plane.crossOrigin = "";   
img_plane.src = "./images/me.png";

const texture_plane = new THREE.Texture(img_plane);
img_plane.onload = () => { texture_plane.needsUpdate = true };

// plane to display
const geometry_plane = new THREE.PlaneGeometry(10,10,10);
const mei = new THREE.Mesh(geometry_plane,
    new THREE.MeshLambertMaterial({ map: texture_plane }))
mei.position.set(0,0,0);
mei.rotation.set(0,0,0)
// mei.scale.set(0.5,0.5,0.5);
scene.add(mei);

var controls = new OrbitControls(camera, renderer.domElement);
console.log(controls);
var scrollPos = 0;
function moveCamera() {
  const t = document.body.getBoundingClientRect().top;
  
  // camera.position.x = t * -0.0002;
  // camera.rotation.y = t * -0.0002;
  if ((document.body.getBoundingClientRect()).top > scrollPos){
    console.log("up")
    camera.position.z = -t * 0.001;
    camera.rotation.x -= t*0.00001;
  }
  else{
    console.log("down")
    camera.position.z = t * 0.001;
    camera.rotation.x += t*0.00001;
  }
  // saves the new position for iteration.
  scrollPos = (document.body.getBoundingClientRect()).top;
}

// document.body.onscroll = moveCamera;
// moveCamera();





function resize() {
    var aspect = window.innerWidth / window.innerHeight;
    camera.aspect = aspect;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
}
window.addEventListener('resize', resize, false);
resize();

function animate() {
  requestAnimationFrame(animate)

  renderer.render(scene, camera)
  // console.log("Camera")
  // console.log(camera.rotation)
  // console.log("cam pos")
  // console.log(camera.position)
  // console.log("Image")
  // console.log(mei.rotation)
}

animate()
});
</script>
