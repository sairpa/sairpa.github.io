name: Release Godot Game

on:
  push:
    branches:
      - main

jobs:
  build_and_release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Build Godot (Example)
        uses: godotengine/build-godot@main
        with:
          godot_version: "4.4.1"  # Specify your Godot version
          build_type: "release"  # Or "debug"

      - name: Export Godot Project
        run: ./path/to/your/godot/binary/bin/godot.sh -s ./project/path/project.godot -e ./path/to/your/export_presets.cfg # Adjust paths
        # You can also use a custom action or the godot-export action here
      - name: Create Release
        uses: actions/create-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          release_name: Release ${{ github.ref_name }}
          body: |
            Release notes for ${{ github.ref_name }}
            ... (Add your release notes here)
          draft: false
          prerelease: false

      - name: Upload Release Assets
        uses: actions/upload-release-assets@v1
        with:
          upload_url: ${{ github.ref_name }}/releases{release_id}/assets{action} # Check if you want to upload release assets, if yes uncomment it
          file: build_windows/*.zip  # Example, replace with your output files
          asset_name: godot_windows_build.zip # Example, replace with your asset name
          asset_content_type: application/zip # Example, replace with your content type