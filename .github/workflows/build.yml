name: "Publish to GitHub Pages and Create Release"
env:
  GODOT_VERSION: 4.4
on:
  workflow_dispatch:
    inputs:
      enable_release:
        description: 'Enable GitHub Release'
        required: false
        default: 'false'
  push:
    branches:
      - main
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    container:
      image: barichello/godot-ci:4.4
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history to get commit info

      - name: Read release config
        id: release_config
        run: |
          ENABLE_RELEASE=$(jq -r .enable_release release_config.json)
          echo "ENABLE_RELEASE=$ENABLE_RELEASE" >> $GITHUB_ENV
      - name: Configure Git safe directory
        run: git config --global --add safe.directory "$(pwd)"
          
      - name: Move HTML5 templates into position
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates
          mv /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
      
      - name: Create staging directory
        run: mkdir -v -p build/web
      
      - name: Build
        run: godot -v --export-release --headless "Web" build/web/index.html project/project.godot
      
      - name: Add coi-service-worker
        run: |
          git clone https://github.com/gzuidhof/coi-serviceworker.git
          mv coi-serviceworker/coi-serviceworker.js build/web/coi-serviceworker.js
          sed -i '3 i <script src="coi-serviceworker.js"></script>' build/web/index.html
      
      - name: Get commit info for release
        id: commit_info
        run: |
          COMMIT_HASH=$(git rev-parse --short HEAD)
          COMMIT_MESSAGE=$(git log -1 --pretty=%B | tr '\n' ' ')
          echo "COMMIT_HASH=$COMMIT_HASH" >> $GITHUB_ENV
          echo "COMMIT_MESSAGE=$COMMIT_MESSAGE" >> $GITHUB_ENV
          echo "RELEASE_TAG=release-$COMMIT_HASH" >> $GITHUB_ENV
      
      - name: Create release archive
        run: |
          cd build
          zip -r ../web-build-${{ env.COMMIT_HASH }}.zip web/
      
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3.9.3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web
          force_orphan: true
          user_name: "github-ci[bot]"
          user_email: "github-actions[bot]@users.noreply.github.com"
          commit_message: "Publish to gh-pages"
      
      - name: Create GitHub Release
        if: ${{ env.ENABLE_RELEASE == 'true' }}
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          release_name: "${{ env.COMMIT_MESSAGE }}"
          body: |
            Release created from commit ${{ env.COMMIT_HASH }}
            Commit message: ${{ env.COMMIT_MESSAGE }}
          draft: false
          prerelease: false
      
      - name: Upload Release Asset
        if: ${{ env.ENABLE_RELEASE == 'true' }}
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./web-build-${{ env.COMMIT_HASH }}.zip
          asset_name: web-build-${{ env.COMMIT_HASH }}.zip
          asset_content_type: application/zip
