name: "Build All Platforms and Create Release"
env:
  GODOT_VERSION: 4.4
on:
  workflow_dispatch:
  push:
    branches:
      - main
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    container:
      image: barichello/godot-ci:4.4
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history to get commit info

      - name: Configure Git safe directory
        run: git config --global --add safe.directory "$(pwd)"
          
      - name: Move export templates into position
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates
          mv /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
      
      - name: Create build directories
        run: |
          mkdir -v -p build/web
          mkdir -v -p build/windows
          mkdir -v -p build/linux
          mkdir -v -p build/mac
          mkdir -v -p build/android
      
      - name: Get export presets
        id: get_presets
        run: |
          # Read export presets and extract names
          PRESETS=$(grep "name=" project/export_presets.cfg | sed 's/name="\(.*\)"/\1/')
          echo "Found export presets: $PRESETS"
          echo "PRESETS<<EOF" >> $GITHUB_ENV
          echo "$PRESETS" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV
      
      - name: Get commit info for release
        id: commit_info
        run: |
          COMMIT_HASH=$(git rev-parse --short HEAD)
          COMMIT_MESSAGE=$(git log -1 --pretty=%B)
          echo "COMMIT_HASH=$COMMIT_HASH" >> $GITHUB_ENV
          echo "COMMIT_MESSAGE=$COMMIT_MESSAGE" >> $GITHUB_ENV
          echo "RELEASE_TAG=release-$COMMIT_HASH" >> $GITHUB_ENV
      
      - name: Build Web Export
        run: |
          if grep -q "name=\"Web\"" project/export_presets.cfg; then
            echo "Building Web export..."
            godot -v --export-release --headless "Web" build/web/index.html project/project.godot
            
            # Add coi-service-worker
            git clone https://github.com/gzuidhof/coi-serviceworker.git
            mv coi-serviceworker/coi-serviceworker.js build/web/coi-serviceworker.js
            sed -i '3 i <script src="coi-serviceworker.js"></script>' build/web/index.html
            
            # Create archive
            cd build
            zip -r ../web-build-${{ env.COMMIT_HASH }}.zip web/
            cd ..
          else
            echo "Web export preset not found, skipping..."
          fi
      
      - name: Build Windows Export
        run: |
          if grep -q "name=\"Windows" project/export_presets.cfg; then
            echo "Building Windows export..."
            godot -v --export-release --headless "Windows Desktop" build/windows/game-${{ env.COMMIT_HASH }}.exe project/project.godot
            
            # Create archive
            cd build
            zip -r ../windows-build-${{ env.COMMIT_HASH }}.zip windows/
            cd ..
          else
            echo "Windows export preset not found, skipping..."
          fi
      
      - name: Build Linux Export
        run: |
          if grep -q "name=\"Linux" project/export_presets.cfg; then
            echo "Building Linux export..."
            godot -v --export-release --headless "Linux/X11" build/linux/game-${{ env.COMMIT_HASH }} project/project.godot
            
            # Create archive
            cd build
            zip -r ../linux-build-${{ env.COMMIT_HASH }}.zip linux/
            cd ..
          else
            echo "Linux export preset not found, skipping..."
          fi
      
      - name: Build macOS Export
        run: |
          if grep -q "name=\"macOS" project/export_presets.cfg; then
            echo "Building macOS export..."
            godot -v --export-release --headless "macOS" build/mac/game-${{ env.COMMIT_HASH }}.zip project/project.godot
            
            # Create archive
            cd build
            zip -r ../mac-build-${{ env.COMMIT_HASH }}.zip mac/
            cd ..
          else
            echo "macOS export preset not found, skipping..."
          fi
      
      - name: Build Android Export
        run: |
          if grep -q "name=\"Android" project/export_presets.cfg; then
            echo "Building Android export..."
            godot -v --export-release --headless "Android" build/android/game-${{ env.COMMIT_HASH }}.apk project/project.godot
            
            # Create archive
            cd build
            zip -r ../android-build-${{ env.COMMIT_HASH }}.zip android/
            cd ..
          else
            echo "Android export preset not found, skipping..."
          fi
      
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3.9.3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web
          force_orphan: true
          user_name: "github-ci[bot]"
          user_email: "github-actions[bot]@users.noreply.github.com"
          commit_message: "Publish to gh-pages"
      
      - name: Create GitHub Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          release_name: Release ${{ env.COMMIT_HASH }}
          body: |
            Release created from commit ${{ env.COMMIT_HASH }}
            Commit message: ${{ env.COMMIT_MESSAGE }}
          draft: false
          prerelease: false
      
      - name: Upload Web Release Asset
        if: fileExists('./web-build-${{ env.COMMIT_HASH }}.zip')
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./web-build-${{ env.COMMIT_HASH }}.zip
          asset_name: web-build-${{ env.COMMIT_HASH }}.zip
          asset_content_type: application/zip
      
      - name: Upload Windows Release Asset
        if: fileExists('./windows-build-${{ env.COMMIT_HASH }}.zip')
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./windows-build-${{ env.COMMIT_HASH }}.zip
          asset_name: windows-build-${{ env.COMMIT_HASH }}.zip
          asset_content_type: application/zip
      
      - name: Upload Linux Release Asset
        if: fileExists('./linux-build-${{ env.COMMIT_HASH }}.zip')
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./linux-build-${{ env.COMMIT_HASH }}.zip
          asset_name: linux-build-${{ env.COMMIT_HASH }}.zip
          asset_content_type: application/zip
      
      - name: Upload macOS Release Asset
        if: fileExists('./mac-build-${{ env.COMMIT_HASH }}.zip')
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./mac-build-${{ env.COMMIT_HASH }}.zip
          asset_name: mac-build-${{ env.COMMIT_HASH }}.zip
          asset_content_type: application/zip
      
      - name: Upload Android Release Asset
        if: fileExists('./android-build-${{ env.COMMIT_HASH }}.zip')
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./android-build-${{ env.COMMIT_HASH }}.zip
          asset_name: android-build-${{ env.COMMIT_HASH }}.zip
          asset_content_type: application/zip