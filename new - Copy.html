<html>
  <head>
    <meta charset="UTF-8" />
    <script src="https://unpkg.com/three@0.139.2/build/three.min.js"></script>
    <script src="https://threejs.org/examples/js/loaders/OBJLoader.js"></script>
    <script src="https://unpkg.com/three@0.139.2/examples/js/controls/OrbitControls.js"></script>
    <script>
      
      window.addEventListener(`DOMContentLoaded`, () => {
        const myCanvas = document.querySelector('#myCanvas');

        
        const scene = new THREE.Scene();
    
        const camera = new THREE.PerspectiveCamera(
          50,
          myCanvas.offsetWidth / myCanvas.offsetHeight
        );
        camera.position.set(1, 1, 1);
        camera.lookAt(scene.position);

        
        const renderer = new THREE.WebGLRenderer({
          antialias: true,
          canvas: myCanvas,
        });
        renderer.setClearColor(0xffffff, 1.0); 
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.setSize(myCanvas.offsetWidth, myCanvas.offsetHeight);

        var manager = new THREE.LoadingManager();
        manager.onProgress = function ( item, loaded, total ) {
          console.log( item, loaded, total );
        };

        var loader = new THREE.OBJLoader( manager );
        loader.load( 'https://threejs.org/examples/obj/male02/male02.obj', function ( object ) {
          // traverse through complete object structure
          object.traverse( function ( child ) {
            // can apply texture? Mesh -> yes
            if ( child instanceof THREE.Mesh ) {
              // use child.name to identify Mesh by name given
              // when .obj was exported so you can
              // colorize / change texture only on 
              // specific parts of the object
              console.log('child', child);
              child.material.map = texture;
              
              if (child.name === 'dach') {
              // color mesh in red
                var color = new THREE.Color("rgb(255, 0, 0)");
                child.material.color.set(color);
              }
            }
          });

          // position object
          object.position.y = - 95;

          // add object to scene
          scene.add( object );
        }, 
        onObjLoaderProgress, 
        onObjLoaderError );

        // Obj Loader Progress Handler
        var onObjLoaderProgress = function ( xhr ) {
          if ( xhr.lengthComputable ) {
              var percentComplete = xhr.loaded / xhr.total * 100;
              console.log( Math.round(percentComplete, 2) + '% downloaded' );
          }
        };

        // Obj Loader Error Handler
        var onObjLoaderError = function ( xhr ) {};

        
        const orbitControls = new THREE.OrbitControls(
          camera,
          renderer.domElement
        );
        orbitControls.maxPolarAngle = Math.PI * 0.5;
        orbitControls.minDistance = 0.1;
        orbitControls.maxDistance = 100;
        orbitControls.autoRotate = true; 
        orbitControls.autoRotateSpeed = 1.0; 

        
        renderer.setAnimationLoop(() => {
          
          orbitControls.update();

          
          renderer.render(scene, camera);
        });
      });
    </script>
  </head>
  <body>
    <canvas id="myCanvas" style="width: 100%; height: 100%"></canvas>
  </body>
</html>
